name: Smart Money Daily Market Predictor

on:
  schedule:
    # GitHub cron uses UTC: 15:30 UTC = 21:00 IST, weekdays (weekly scan is gated to Friday in India time).
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
    inputs:
      force_weekly:
        description: "Include the weekly sweep radar even when this manual run is not Friday"
        required: false
        type: boolean
        default: false

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Free Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Core Regression Tests
        run: python -m unittest discover -s tests -v

      - name: Run Daily Institutional Prediction Engine
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          MAIL_PORT: ${{ secrets.MAIL_PORT || '587' }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || secrets.MAIL_USERNAME }}
          REQUIRE_EMAIL: 'true'
          FORCE_WEEKLY: ${{ inputs.force_weekly }}
        run: |
          if [ "$FORCE_WEEKLY" = "true" ]; then
            python src/main.py --weekly
          else
            python src/main.py
          fi

      - name: Commit and Push Prediction Reports
        run: |
          git config --global user.name "SmartMoney-Bot"
          git config --global user.email "bot@smartmoney.ai"
          git add reports/ data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(daily-report): update prediction report for $(date +'%Y-%m-%d')" && git push)
